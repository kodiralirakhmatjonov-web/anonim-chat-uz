name: Deploy Telegram Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve or create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D1_DATABASE_ID="$(node scripts/resolve-d1.mjs)"
          test -n "$D1_DATABASE_ID"
          echo "database_id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
          sed -i "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/g" wrangler.jsonc
          grep -q "$D1_DATABASE_ID" wrangler.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply anonymous-chat-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Generate webhook secret
        id: webhook_secret
        shell: bash
        run: |
          WEBHOOK_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "value=$WEBHOOK_SECRET" >> "$GITHUB_OUTPUT"

      - name: Upload Telegram bot token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Upload webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook_secret.outputs.value }}
        run: |
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

      - name: Resolve Worker URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_URL="$(node scripts/resolve-worker-url.mjs)"
          test -n "$WORKER_URL"
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Health check
        run: curl --fail --silent --show-error "${{ steps.worker_url.outputs.url }}/health"

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook_secret.outputs.value }}
          WORKER_URL: ${{ steps.worker_url.outputs.url }}
        run: node scripts/set-webhook.mjs
