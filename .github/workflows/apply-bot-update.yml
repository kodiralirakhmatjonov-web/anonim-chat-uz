name: Apply bot ZIP update

on:
  push:
    paths:
      - "anonymous-chat-bot-*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract update
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'anonymous-chat-bot-*.zip' \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "No anonymous-chat-bot ZIP found."
            exit 1
          fi

          echo "Applying ${ZIP_FILE}"

          unzip -o "${ZIP_FILE}" -d .
          rm -f "${ZIP_FILE}"

      - name: Commit applied update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Apply bot update"
          git push
