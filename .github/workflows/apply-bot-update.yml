name: Apply bot ZIP update

on:
  push:
    paths:
      - "anonymous-chat-bot-*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and safely extract update
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'anonymous-chat-bot-*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "No anonymous-chat-bot ZIP found."
            exit 1
          fi

          echo "Applying ${ZIP_FILE}"

          TMP_DIR="$(mktemp -d)"
          unzip -o "${ZIP_FILE}" -d "${TMP_DIR}"

          # GitHub Actions' built-in token is not allowed to create/update
          # workflow files. Workflow YAML files must be uploaded manually.
          rm -rf "${TMP_DIR}/.github/workflows"

          rsync -a "${TMP_DIR}/" ./

          rm -rf "${TMP_DIR}"
          rm -f anonymous-chat-bot-*.zip

      - name: Commit applied update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Apply bot update"
          git push
