name: Update & Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - "anonymous-chat-bot-*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot-update-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and safely extract update
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'anonymous-chat-bot-*.zip' -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "No anonymous-chat-bot ZIP found."
            exit 1
          fi

          echo "Applying ${ZIP_FILE}"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT

          unzip -q -o "${ZIP_FILE}" -d "${TMP_DIR}"

          # Workflow files are managed manually. Never let an update ZIP
          # replace or create GitHub Actions workflows.
          rm -rf "${TMP_DIR}/.github/workflows"

          rsync -a "${TMP_DIR}/" ./
          rm -f anonymous-chat-bot-*.zip

      - name: Commit applied update
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit. Continuing to deploy current repository state."
          else
            git commit -m "Apply bot update"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve or create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          D1_DATABASE_ID="$(node scripts/resolve-d1.mjs)"
          test -n "$D1_DATABASE_ID"
          echo "database_id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"
          sed -i "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/g" wrangler.jsonc
          grep -q "$D1_DATABASE_ID" wrangler.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply anonymous-chat-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Wrangler deploy attempt ${attempt}/3"
            if npx wrangler deploy; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo "Wrangler deploy failed after 3 attempts."
          exit 1

      - name: Generate webhook secret
        id: webhook_secret
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "value=$WEBHOOK_SECRET" >> "$GITHUB_OUTPUT"

      - name: Upload Telegram bot token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Upload webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook_secret.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

      - name: Resolve Worker URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="$(node scripts/resolve-worker-url.mjs)"
          test -n "$WORKER_URL"
          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL"

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.worker_url.outputs.url }}/health"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed after 5 attempts."
          exit 1

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook_secret.outputs.value }}
          WORKER_URL: ${{ steps.worker_url.outputs.url }}
        run: node scripts/set-webhook.mjs
